<script>
// ghostproc – Minecraft Java Skin, 64x64, Classic (Steve-Arme, 4 px) oder Slim (Alex-Arme, 3 px)
// Liefert RGBA-Pixel (Uint8ClampedArray, 64*64*4). Deterministisch über Seed.
// 6x5-Symbole für die Brust (X = Akzent, H = Highlight, W = Weiß, . = Schwarz)
const GLYPHS = {
  ghost:  ['.XXXX.', 'XWXXWX', 'XXXXXX', 'XXXXXX', 'X.XX.X'],
  skull:  ['.XXXX.', 'XWXXWX', 'XXXXXX', '.XHHX.', '.X..X.'],
  binary: ['.X..X.', 'XX.X.X', '.X.X.X', '.X.X.X', 'XXX.X.'],
  eye:    ['......', '.XXXX.', 'XHWWHX', '.XXXX.', '......'],
  // --- neue Symbole (v3)
  heart:  ['HX..XX', 'XXXXXX', 'XXXXXX', '.XXXX.', '..XX..'],
  bolt:   ['...HX.', '..XX..', '.XXXX.', '..XX..', '.X....'],
  lambda: ['XX....', '..X...', '..XX..', '.X..X.', 'X....H'],
  hash:   ['.X..X.', 'XXXXXX', '.X..X.', 'XXXXXX', '.X..X.'],
  bug:    ['X....X', '.XHHX.', 'XXXXXX', '.XXXX.', 'X.XX.X'],
  warning:['..XX..', '.XWWX.', '.XWWX.', 'XXXXXX', 'XXWWXX'],
  lock:   ['.XXXX.', '.X..X.', 'XXXXXX', 'XHWWXX', 'XXXXXX'],
  moon:   ['..XXX.', '.XX...', '.XH...', '.XX...', '..XXX.'],
  crown:  ['X.XX.X', 'XXXXXX', 'XWXXWX', 'XXXXXX', 'HHHHHH']
};
function buildGhostprocSkin(opts) {
  opts = opts || {};
  const seed = opts.seed;
  const col = opts.colors || {};
  const O = {
    symbol: opts.symbol || 'prompt',         // prompt | none | ghost | skull | binary | eye | heart | bolt | lambda | hash | bug | warning | lock | moon | crown
    mask: opts.mask || 'tech',               // tech | breather | glitch | none | bandana | grin | skull | gasmask | fangs | censor | stitch
    hood: opts.hood || 'deep',               // deep | trim | down | ears | horns | stripe | circuit | beanie | none
    outfit: opts.outfit || 'hoodie',         // hoodie | coat | harness | vest | armor | scarf | tracksuit | labcoat
    particles: opts.particles || 'dissolve', // dissolve | drip | none | sparks | rain | flames | scan | blocks | aura
    eyes: opts.eyes || 'solid',              // solid | tears | neon | red | void | iris | visor | glitch | cyclops
    arms: opts.arms === 'slim' ? 'slim' : 'classic', // classic (Steve, 4 px) | slim (Alex, 3 px)
    body: opts.body === 'female' ? 'female' : 'male' // male | female (lange Haare, Wimpern, Taille)
  };
  const W = 64, H = 64;
  const px = new Uint8ClampedArray(W * H * 4); // alles transparent

  // --- Seeded PRNG (mulberry32) -> jedes Mal identisches Ergebnis
  let s = (seed === undefined ? 0x60570C : seed) >>> 0;
  const rnd = () => {
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));

  // --- Palette (Vorgabe)
  const C = {
    A: hex(col.A || '#1A1A1D'), // Anthrazit
    D: hex(col.D || '#121214'), // extremes Dunkelgrau
    P: hex(col.P || '#9D00FF'), // Akzent (Standard: Neon-Lila)
    M: hex(col.M || '#E000FF'), // Glitch-Highlight (Standard: Magenta)
    V: hex(col.V || '#510087'), // Schatten-Akzent (Standard: Violett)
    W: hex(col.W || '#FFFFFF'), // Augen
    K: hex('#000000'),          // Pechschwarz (Kapuzenschatten)
    S: hex(col.S || '#57525F'), // Geister-Haut
    B: hex(col.B || '#0A0A0C'), // Boot-/Handschuh-Schwarz
    N: hex('#D6D0C4'),          // Knochen (Schädel-Maske, Reißzähne, Hörner)
    L: hex('#DCDCE2'),          // Laborkittel-Weiß
    R: hex('#FF2020')           // rot glühende Augen
  };
  C.W.eye = true; C.R.eye = true;
  const NS = col.noise ?? 1;   // Rausch-Stärke (helle Paletten brauchen weniger)

  // Rauschen: additiv bei dunklen Tönen, relativ bei hellen. g = Verlauf (+heller / -dunkler)
  // rel = relativer Rauschanteil (helle Materialien wie Knochen/Kittel nutzen weniger)
  const tone = (c, amt = 5, g = 0, rel = 0.09) => {
    if (c.eye || c === C.K) return c; // Augen & Schatten bleiben exakt
    return c.map(v => {
      const a = Math.max(amt, v * rel) * NS;
      return Math.max(0, Math.min(255, Math.round(v + (rnd() * 2 - 1) * a + g)));
    });
  };
  const pick = (...cs) => cs[Math.floor(rnd() * cs.length)];

  const set = (x, y, c) => {
    const i = (y * W + x) * 4;
    px[i] = c[0]; px[i + 1] = c[1]; px[i + 2] = c[2]; px[i + 3] = 255;
  };

  // Box-UV-Layout eines Minecraft-Quaders (u,v = Ursprung; w = Breite, h = Höhe, d = Tiefe)
  const box = (u, v, w, h, d) => ({
    top:    [u + d,         v,     w, d],
    bottom: [u + d + w,     v,     w, d],
    right:  [u,             v + d, d, h],
    front:  [u + d,         v + d, w, h],
    left:   [u + d + w,     v + d, d, h],
    back:   [u + 2 * d + w, v + d, w, h]
  });
  // fn(x, y, w, h) -> Farbe oder null (= transparent, nur für Overlays)
  const paint = (rect, fn) => {
    const [x0, y0, w, h] = rect;
    for (let y = 0; y < h; y++)
      for (let x = 0; x < w; x++) {
        const c = fn(x, y, w, h);
        if (c) set(x0 + x, y0 + y, c);
      }
  };
  const vgrad = (y, h, span = 6) => span / 2 - (y / Math.max(1, h - 1)) * span; // oben hell, unten dunkel
  const SIDES = ['front', 'right', 'back', 'left'];
  const hasMask = O.mask !== 'none' && O.mask !== 'stitch';          // "stitch" ist aufgenähte Haut, kein Riemen
  const AW = O.arms === 'slim' ? 3 : 4;                               // Armbreite im Texturlayout
  const fem = O.body === 'female';
  const lashes = ['solid', 'tears', 'neon', 'red', 'iris', 'glitch'].includes(O.eyes);
  const hoodUp = ['deep', 'trim', 'ears', 'horns', 'stripe', 'circuit'].includes(O.hood);

  // =========================================================
  // KOPF – Basis (0,0)-(32,16)
  // =========================================================
  const head = box(0, 0, 8, 8, 8);
  const hair = () => tone(pick(C.A, C.D, C.D), 5);
  const femHair = (x = 0, g = 0) => tone(x % 3 === 1 ? C.V : C.D, 4, g); // lange Haare: senkrechte Strähnen im Schattenton
  const skin = (g = 0) => tone(C.S, 4, g);
  const mask = (y) => tone(y === 6 ? C.A : C.D, 4, y === 6 ? 3 : 0);
  const bone = (g = 0) => tone(C.N, 6, g, 0.03);

  // Augenzeile (y = 4). "solid" und "tears" bleiben exakt wie in v2.
  const eyePix = x => {
    const isEye = [1, 2, 5, 6].includes(x);
    switch (O.eyes) {
      case 'neon':    return isEye ? C.M : skin(-2);
      case 'red':     return isEye ? C.R : skin(-2);
      case 'void':    return isEye ? C.K : skin(-2);
      case 'iris':    return (x === 2 || x === 5) ? tone(C.P, 3) : isEye ? C.W : skin(-2);
      case 'visor':   return isEye ? C.M : tone(C.P, 3);
      case 'glitch':  return (x === 1 || x === 2) ? C.W : x === 5 ? C.M : x === 6 ? tone(C.P, 3) : skin(-2);
      case 'cyclops': return (x === 3 || x === 4) ? C.W : (x === 2 || x === 5) ? C.K : skin(-2);
      default:        return isEye ? C.W : skin(-2);
    }
  };
  // Pixel-Zensur: 4 Mosaik-Blöcke à 2×2 (rnd nur, wenn gewählt)
  const censorCols = O.mask === 'censor' ? [10, -6, 4, -12].map(g => tone(pick(C.A, C.V, C.S), 4, g)) : null;

  paint(head.top, (x, y) => (x === 5 && y >= 5) || (x === 6 && y === 7) ? tone(C.V, 6) : hair());
  paint(head.bottom, () => tone(C.D, 3));
  paint(head.front, (x, y) => {
    if (y <= 1) return (x === 5 && y === 0) || (x === 6 && y <= 1) ? tone(C.V, 6) : hair();
    if (y === 2) return [0, 1, 2, 6, 7].includes(x) ? hair() : skin(-6); // asymmetrischer Pony
    if (fem && (x === 0 || x === 7) && y <= 5 && !(O.eyes === 'visor' && y === 4)) return femHair(x); // Strähnen am Gesicht
    if (y === 3) return O.eyes === 'glitch' && x === 6 ? C.M : fem && lashes && (x === 1 || x === 6) ? C.K : skin(-8); // Brauenschatten / Wimpern
    if (y === 4) return eyePix(x);                                        // Herobrine-Augen
    if (y === 5) return O.eyes === 'tears' && (x === 1 || x === 6) ? tone(C.P, 3)
                      : O.eyes === 'glitch' && x === 5 ? tone(C.V, 3) : skin(0);
    if (!hasMask) {
      if (O.eyes === 'tears' && y === 6 && (x === 1 || x === 6)) return tone(C.V, 4);
      if (O.mask === 'stitch') {                                          // zugenähter Mund
        if (y === 6) return x >= 1 && x <= 6 ? (x % 2 === 0 ? tone(C.V, 3) : C.K) : skin(-2);
        return (x === 2 || x === 4) ? tone(C.V, 3, -6) : skin(-6);
      }

        const x = Math.floor(rnd() * ow);
        const len = rnd() < 0.35 ? 2 : 1;
        for (let k = 0; k < len && x + k < ow; k++) {
          set(ox + x + k, oy + y, glitch());
          used.add(y);
        }
      }
    }
    // Vorder-/Rückseite: nur die Spalte an der Außenkante, sehr sparsam
    const edgeFront = outer === 'right' ? 0 : b.front[2] - 1;
    const edgeBack = outer === 'right' ? b.back[2] - 1 : 0;
    for (let y = 1; y < oh; y++) {
      if (rnd() < density * 0.45) set(b.front[0] + edgeFront, b.front[1] + y, glitch());
      if (rnd() < density * 0.45) set(b.back[0] + edgeBack, b.back[1] + y, glitch());
    }
  };
  // Mantel: Schöße über den Beinen (Overlay), offen an der Vorderseite
  if (O.outfit === 'coat') {
    [[box(0, 32, 4, 12, 4), 'right'], [box(0, 48, 4, 12, 4), 'left']].forEach(([b, outer]) => {
      paint(b[outer], (x, y, w, h) => y <= 7 ? (y === 7 ? tone(C.V, 4, -4) : coat(y, 8)) : null);
      paint(b.back, (x, y) => y <= 7 ? (y === 7 ? tone(C.V, 4, -4) : coat(y, 8)) : null);
      const fc = outer === 'right' ? 0 : 3;
      paint(b.front, (x, y) => x === fc && y <= 7 ? tone(C.V, 4, -6) : null);
    });
  }
  if (O.particles === 'drip') {   // Code-Tropfen: senkrechte Fäden, unten hell
    const drip = (b, outer, n) => {
      const [ox, oy, ow, oh] = b[outer];
      for (let i = 0; i < n; i++) {
        const x = Math.floor(rnd() * ow), y0 = Math.floor(rnd() * (oh - 3)), len = 2 + Math.floor(rnd() * 3);
        for (let k = 0; k < len && y0 + k < oh; k++) set(ox + x, oy + y0 + k, k === len - 1 ? C.M : tone(k === 0 ? C.V : C.P, 3));
      }
      const fx = outer === 'right' ? b.front[0] : b.front[0] + b.front[2] - 1;
      for (let y = 2; y < oh; y += 2 + Math.floor(rnd() * 4)) set(fx, b.front[1] + y, tone(pick(C.V, C.P), 3));
    };
    drip(box(40, 32, AW, 12, 4), 'right', 3); drip(box(48, 48, AW, 12, 4), 'left', 3);
    drip(box(0, 32, 4, 12, 4), 'right', 2);  drip(box(0, 48, 4, 12, 4), 'left', 2);
  }
  const pOn = O.particles === 'dissolve';
  const ad = pOn ? (opts.armDensity ?? 0.38) : 0, ld = pOn ? (opts.legDensity ?? 0.30) : 0;
  particles(box(40, 32, AW, 12, 4), 'right', ad); // rechter Arm  Overlay
  particles(box(48, 48, AW, 12, 4), 'left', ad);  // linker Arm   Overlay
  particles(box(0, 32, 4, 12, 4), 'right', ld);  // rechtes Bein Overlay
  particles(box(0, 48, 4, 12, 4), 'left', ld);   // linkes Bein  Overlay

  // --- neue Partikel (v3). Dichte kommt vom selben Regler.
  const LIMBS = ARM_OV.concat(LEG_OV);
  const dens = opts.armDensity ?? 0.38;
  if (O.particles === 'sparks') {                 // Funken: einzelne helle Pixel überall
    LIMBS.forEach(([b]) => SIDES.forEach(k => paint(b[k], () => rnd() < dens * 0.14 ? (rnd() < 0.3 ? C.W : rnd() < 0.6 ? C.M : tone(C.P, 3)) : null)));
  }
  if (O.particles === 'rain') {                   // Matrix-Regen: lange Spalten mit Lücken, Kopf unten hell
    LIMBS.forEach(([b]) => SIDES.forEach(k => {
      const [ox, oy, ow, oh] = b[k];
      for (let x = 0; x < ow; x++) {
        if (rnd() > dens * 0.9) continue;
        const len = 3 + Math.floor(rnd() * 6), y0 = Math.floor(rnd() * (oh - 2));
        for (let i = 0; i < len && y0 + i < oh; i++) {
          if (i < len - 1 && rnd() < 0.25) continue;
          set(ox + x, oy + y0 + i, i === len - 1 ? C.M : tone(i < len / 2 ? C.V : C.P, 3));
        }
      }
    }));
  }
  if (O.particles === 'flames') {                 // Neon-Flammen von Händen und Füßen aufwärts
    LIMBS.forEach(([b]) => SIDES.forEach(k => {
      const [ox, oy, ow, oh] = b[k];
      for (let x = 0; x < ow; x++) {
        const h = Math.floor(rnd() * (1 + dens * 9));
        for (let i = 0; i < h; i++) set(ox + x, oy + oh - 1 - i, i === h - 1 ? tone(C.V, 4) : i < h / 2 ? C.M : tone(C.P, 3));
        if (rnd() < dens * 0.35 && h + 2 < oh) set(ox + x, oy + oh - 2 - h - Math.floor(rnd() * 3), C.M); // Glut
      }
    }));
  }
  if (O.particles === 'scan') {                   // Scanlines: waagrechte Linien rund um die Glieder
    LIMBS.forEach(([b]) => {
      const ph = Math.floor(rnd() * 3);
      SIDES.forEach(k => paint(b[k], (x, y) => (y + ph) % 3 === 0 && rnd() < 0.3 + dens * 0.6 ? (rnd() < 0.2 ? C.M : tone(C.P, 3)) : null));
    });
  }
  if (O.particles === 'blocks') {                 // Datenblöcke: schwebende 2×2-Würfel
    LIMBS.forEach(([b]) => {
      const n = Math.round(1 + dens * 7);
      for (let i = 0; i < n; i++) {
        const [ox, oy, ow, oh] = b[SIDES[Math.floor(rnd() * 4)]];
        const x = Math.floor(rnd() * (ow - 1)), y = Math.floor(rnd() * (oh - 1)), c = pick(C.P, C.M, C.V, C.P);
        for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++) set(ox + x + dx, oy + y + dy, tone(c, 3, dx + dy === 0 ? 30 : dx + dy === 2 ? -20 : 0));
      }
    });
  }
  if (O.particles === 'aura') {                   // Neon-Aura: leuchtende Kanten und Unterkante
    LIMBS.forEach(([b]) => SIDES.forEach(k => paint(b[k], (x, y, w, h) => {
      if (y === h - 1) return C.M;
      if ((x === 0 || x === w - 1) && rnd() < 0.3 + dens * 0.7) return tone(y > h / 2 ? C.M : C.P, 3);
      return null;
    })));
  }

  // Optional: Glitch-Risse im Torso-Overlay (Seiten + Kanten von Vorder-/Rückseite)
  if (opts.torsoGlitch) {
    const j = box(16, 32, 8, 12, 4);
    ['right', 'left'].forEach(k => {
      const [ox, oy, ow, oh] = j[k];
      for (let y = 2; y < oh; y++) if (rnd() < opts.torsoGlitch) set(ox + Math.floor(rnd() * ow), oy + y, glitch());
    });
    [j.front, j.back].forEach(([ox, oy, ow, oh]) => {
      for (let y = 4; y < oh; y++) {
        if (rnd() < opts.torsoGlitch * 0.5) set(ox, oy + y, glitch());
        if (rnd() < opts.torsoGlitch * 0.5) set(ox + ow - 1, oy + y, glitch());
      }
    });
  }

  return px;
}

  { id:'ghostproc-byte-fox', name:'Byte Fox', pal:'ember', fresh:true, opts:{ seed:0xB17EF0, arms:'slim', body:'female', hood:'ears', mask:'bandana', eyes:'glitch', outfit:'vest', symbol:'hash', particles:'flames', armDensity:0.45 },
    note:{ de:'Ohren-Kapuze, Bandana, Tech-Weste und Flammen.', en:'Eared hood, bandana, tech vest and flames.' } }
];
GHOSTPROC_VARIANTS.forEach(v => v.opts.colors = PAL[v.pal]);
if (typeof module !== 'undefined') module.exports = { buildGhostprocSkin, GHOSTPROC_VARIANTS, PAL, PAL_NAMES, OPTIONS };

// ---------------- Ansichten
const FRONT = [[8,8,8,8,4,0],[40,8,8,8,4,0],[20,20,8,12,4,8],[20,36,8,12,4,8],
  [44,20,4,12,0,8],[44,36,4,12,0,8],[36,52,4,12,12,8],[52,52,4,12,12,8],
  [4,20,4,12,4,20],[4,36,4,12,4,20],[20,52,4,12,8,20],[4,52,4,12,8,20]];
const BACK = [[24,8,8,8,4,0],[56,8,8,8,4,0],[32,20,8,12,4,8],[32,36,8,12,4,8],
  [52,20,4,12,12,8],[52,36,4,12,12,8],[44,52,4,12,0,8],[60,52,4,12,0,8],
  [12,20,4,12,8,20],[12,36,4,12,8,20],[28,52,4,12,4,20],[12,52,4,12,4,20]];
const RIGHT = [[0,8,8,8,0,0],[32,8,8,8,0,0],[40,20,4,12,2,8],[40,36,4,12,2,8],[0,20,4,12,2,20],[0,36,4,12,2,20]];
const LEFT = [[16,8,8,8,0,0],[48,8,8,8,0,0],[40,52,4,12,2,8],[56,52,4,12,2,8],[24,52,4,12,2,20],[8,52,4,12,2,20]];
// Schmale Arme (3 px): andere Quellpositionen, Arme rücken 1 px an den Torso
const SLIM = {
  FRONT: FRONT.slice(0, 4).concat([[44,20,3,12,1,8],[44,36,3,12,1,8],[36,52,3,12,12,8],[52,52,3,12,12,8]], FRONT.slice(8)),
  BACK: BACK.slice(0, 4).concat([[51,20,3,12,12,8],[51,36,3,12,12,8],[43,52,3,12,1,8],[59,52,3,12,1,8]], BACK.slice(8)),
  RIGHT: RIGHT,
  LEFT: LEFT.slice(0, 2).concat([[39,52,4,12,2,8],[55,52,4,12,2,8]], LEFT.slice(4))
};
const WIDE = { FRONT, BACK, RIGHT, LEFT };
const viewsFor = arms => arms === 'slim' ? SLIM : WIDE;
const OVERLAY = [[32,0,32,16],[0,32,56,16],[0,48,16,16],[48,48,16,16]];

// ---------------- Sprache / Language
const I18N = {

};
const pickLang = () => {
  const q = new URLSearchParams(location.search).get('lang');
  if (q === 'de' || q === 'en') return q;
  try { const s = localStorage.getItem('ghostproc-lang'); if (s === 'de' || s === 'en') return s; } catch (e) {}
  return (navigator.languages || [navigator.language || 'en']).some(l => /^de/i.test(l)) ? 'de' : 'en';
};
let lang = pickLang();
const T = k => I18N[lang][k];
const L = v => typeof v === 'string' ? v : v[lang];
const palName = pid => L(PAL_NAMES[pid]);

const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const compose = (t, skin, parts) => { const x = t.getContext('2d'); x.imageSmoothingEnabled = false; x.clearRect(0, 0, t.width, t.height);
  parts.forEach(([sx,sy,w,h,dx,dy]) => x.drawImage(skin, sx,sy,w,h, dx,dy,w,h)); };
const renderSkin = (opts) => { const c = mk(64, 64); c.getContext('2d').putImageData(new ImageData(buildGhostprocSkin(opts), 64, 64), 0, 0); return c; };
const download = (canvas, name) => { const a = document.createElement('a'); a.download = name + '.png'; a.href = canvas.toDataURL('image/png'); a.click(); };
const hexSeed = n => '0x' + (n >>> 0).toString(16).toUpperCase();
const parseSeed = s => { const n = parseInt(String(s).trim(), /^0x/i.test(String(s).trim()) ? 16 : 10); return Number.isFinite(n) ? n >>> 0 : 0; };

// ---------------- Editor
const $ = id => document.getElementById(id);
const FIELDS = ['arms', 'body', 'symbol', 'mask', 'hood', 'outfit', 'eyes', 'particles'];
let state = {};
let editorSkin = null;

// Optionen der Auswahllisten (neu) beschriften, Werte bleiben erhalten
function fillSelects() {
  FIELDS.forEach(f => {
    const sel = $(f), cur = sel.value;
    sel.innerHTML = '';
    OPTIONS[f].forEach(([v, de, en]) => { const o = document.createElement('option'); o.value = v; o.textContent = lang === 'de' ? de : en; sel.append(o); });
    if (cur) sel.value = cur;
  });
  const pv = $('preset').value;
  $('preset').innerHTML = '';
  GHOSTPROC_VARIANTS.forEach(v => { const o = document.createElement('option'); o.value = v.id; o.textContent = v.name; $('preset').append(o); });
  const c = document.createElement('option'); c.value = ''; c.textContent = T('custom'); c.disabled = true; $('preset').append(c);
  $('preset').value = pv;
  const gv = $('galPal').value;
  $('galPal').innerHTML = '';
  [['', T('galOrig')]].concat(Object.keys(PAL).filter(k => k !== 'custom').map(k => [k, palName(k)]))
    .forEach(([v, t]) => { const o = document.createElement('option'); o.value = v; o.textContent = t; $('galPal').append(o); });
  $('galPal').value = gv;
  ['galArms', 'galBody'].forEach(id => {
    const sel = $(id), cur = sel.value, f = id === 'galArms' ? 'arms' : 'body';
    sel.innerHTML = '';
    [['', T('asPreset'), T('asPreset')]].concat(OPTIONS[f]).forEach(([v, de, en]) => { const o = document.createElement('option'); o.value = v; o.textContent = lang === 'de' ? de : en; sel.append(o); });
    sel.value = cur;
  });
}
function applyLang(l) {
  lang = l;
  try { localStorage.setItem('ghostproc-lang', l); } catch (e) {}
  document.documentElement.lang = l;
  document.title = T('title');
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = T(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-title]').forEach(el => el.title = T(el.dataset.i18nTitle));
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === l));
  document.querySelectorAll('#pals .pal').forEach(b => { b.title = palName(b.dataset.pal); b.setAttribute('aria-label', palName(b.dataset.pal)); });
  fillSelects();
  if (state.pal) $('palName').textContent = palName(state.pal);
  renderGallery();
}

function stateToOpts() {
  const o = { seed: parseSeed(state.seed), colors: PAL[state.pal], armDensity: +state.armD, legDensity: +state.legD };
  FIELDS.forEach(f => o[f] = state[f]);
  if (+state.torso > 0) o.torsoGlitch = +state.torso;
  return o;
}
function renderEditor() {
  editorSkin = renderSkin(stateToOpts());
  const V = viewsFor(state.arms);
  compose($('vFront'), editorSkin, V.FRONT); compose($('vBack'), editorSkin, V.BACK);
  compose($('vRight'), editorSkin, V.RIGHT); compose($('vLeft'), editorSkin, V.LEFT);
  const t = $('tex').getContext('2d'); t.clearRect(0, 0, 64, 64); t.drawImage(editorSkin, 0, 0);
  if (!$('ovT').checked) OVERLAY.forEach(([a, b, w, h]) => t.clearRect(a, b, w, h));
  document.documentElement.style.setProperty('--acc', PAL[state.pal].P);
  document.querySelectorAll('#pals .pal').forEach(b => b.setAttribute('aria-pressed', b.dataset.pal === state.pal));
  $('palName').textContent = palName(state.pal);
}
function syncControls() {
  FIELDS.forEach(f => $(f).value = state[f]);
  $('armD').value = state.armD; $('torso').value = state.torso; $('seed').value = state.seed;
}
// Dateinamen-Anhang für Abweichungen von der Vorlage (Palette, Modell, Figur)
const suffix = (v, ov) => (ov.pal && ov.pal !== v.pal ? '_' + ov.pal : '')
  + (ov.arms && ov.arms !== (v.opts.arms || 'classic') ? '_' + ov.arms : '')
  + (ov.body && ov.body !== (v.opts.body || 'male') ? '_' + ov.body : '');
// Lädt eine Vorlage – das Ergebnis ist pixelgleich zur Galerie-Version
function loadPreset(v, ov = {}) {
  const o = v.opts;
  state = { pal: ov.pal || v.pal, seed: hexSeed(o.seed), armD: o.armDensity ?? 0.38, legD: o.legDensity ?? 0.30, torso: o.torsoGlitch ?? 0,
            arms: ov.arms || o.arms || 'classic', body: ov.body || o.body || 'male',
            symbol: o.symbol || 'prompt', mask: o.mask || 'tech', hood: o.hood || 'deep',
            outfit: o.outfit || 'hoodie', eyes: o.eyes || 'solid', particles: o.particles || 'dissolve' };
  syncControls();
  $('fname').value = v.id + suffix(v, ov);
  $('preset').value = v.id;
  renderEditor();
}
function changed() {
  $('preset').value = '';
  if (!/-custom$/.test($('fname').value)) $('fname').value += '-custom';
  renderEditor();
}

$('preset').onchange = () => loadPreset(GHOSTPROC_VARIANTS.find(v => v.id === $('preset').value));
const full = pid => Object.assign({}, BASE_DEFAULTS, PAL[pid]);
const syncCustomInputs = () => document.querySelectorAll('.cgrid input').forEach(i => i.value = PAL.custom[i.dataset.k]);
Object.keys(PAL).forEach(pid => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'pal' + (pid === 'custom' ? ' custom' : ''); b.dataset.pal = pid;
  if (pid !== 'custom') { b.style.setProperty('--a', PAL[pid].P); b.style.setProperty('--b', PAL[pid].V); }
  b.onclick = () => {
    if (pid === 'custom') { if (state.pal !== 'custom') { PAL.custom = full(state.pal); syncCustomInputs(); } $('custBox').open = true; }
    state.pal = pid; changed();
  };
  $('pals').append(b);
});
$('custBox').addEventListener('toggle', () => { if ($('custBox').open && state.pal !== 'custom') { PAL.custom = full(state.pal); syncCustomInputs(); } });
document.querySelectorAll('.cgrid input').forEach(i => i.oninput = () => {
  if (state.pal !== 'custom') PAL.custom = full(state.pal);
  PAL.custom[i.dataset.k] = i.value.toUpperCase();
  state.pal = 'custom'; changed();
});
syncCustomInputs();
FIELDS.forEach(f => $(f).onchange = () => { state[f] = $(f).value; changed(); });
$('armD').oninput = () => { state.armD = $('armD').value; state.legD = (state.armD * 0.8).toFixed(3); changed(); };
$('torso').oninput = () => { state.torso = $('torso').value; changed(); };
$('seed').onchange = () => { state.seed = $('seed').value; changed(); };
$('reroll').onclick = () => { state.seed = hexSeed(Math.floor(Math.random() * 0xFFFFFFFF)); $('seed').value = state.seed; changed(); };
$('randAll').onclick = () => {
  const any = a => a[Math.floor(Math.random() * a.length)];
  FIELDS.forEach(f => state[f] = any(OPTIONS[f])[0]);
  state.pal = any(Object.keys(PAL).filter(k => k !== 'custom'));
  state.seed = hexSeed(Math.floor(Math.random() * 0xFFFFFFFF));
  state.armD = (0.25 + Math.random() * 0.4).toFixed(2); state.legD = (state.armD * 0.8).toFixed(3);
  state.torso = Math.random() < 0.25 ? (Math.random() * 0.3).toFixed(2) : 0;
  syncControls();
  $('fname').value = 'ghostproc-' + state.seed.slice(2).toLowerCase();
  $('preset').value = '';
  renderEditor();
};
$('ovT').onchange = renderEditor;
$('dl').onclick = () => download(editorSkin, ($('fname').value || 'ghostproc').replace(/[^\w.-]+/g, '_'));
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => applyLang(b.dataset.lang));

// ---------------- Galerie
function renderGallery() {
  const gp = $('galPal').value, ov = { pal: gp, arms: $('galArms').value, body: $('galBody').value };
  $('cards').innerHTML = '';
  GHOSTPROC_VARIANTS.forEach(v => {
    const opts = Object.assign({}, v.opts, gp ? { colors: PAL[gp] } : {}, ov.arms ? { arms: ov.arms } : {}, ov.body ? { body: ov.body } : {});
    const name = v.id + suffix(v, ov);
    const skin = renderSkin(opts);
    const card = document.createElement('article'); card.className = 'card';
    card.style.setProperty('--cacc', opts.colors.P);
    card.innerHTML = `<h3></h3><p></p><div class="views"></div>
      <div class="row"><button class="edit" type="button"></button><button class="dl" type="button"></button></div>`;
    card.querySelector('h3').textContent = v.name;
    if (v.fresh) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = T('fresh'); card.querySelector('h3').append(t); }
    card.querySelector('p').textContent = L(v.note);
    card.querySelector('.edit').textContent = T('openEditor');
    card.querySelector('.dl').textContent = T('savePng');
    const f = mk(16, 32), r = mk(8, 32);
    const V = viewsFor(opts.arms);
    compose(f, skin, V.FRONT); compose(r, skin, V.RIGHT);
    f.style.width = (16 * 150 / 32) + 'px'; r.style.width = (8 * 150 / 32) + 'px';
    f.setAttribute('role', 'img'); f.setAttribute('aria-label', v.name);
    card.querySelector('.views').append(f, r);
    card.querySelector('.edit').onclick = () => { loadPreset(v, ov); $('studio').scrollIntoView({ behavior: 'smooth' }); };
    card.querySelector('.dl').onclick = () => download(skin, name);
    $('cards').append(card);
  });
}
$('galPal').onchange = $('galArms').onchange = $('galBody').onchange = renderGallery;
document.querySelectorAll('.stage canvas.v').forEach(c => c.style.width = (c.width * 256 / 32) + 'px');
applyLang(lang);
loadPreset(GHOSTPROC_VARIANTS[0]);
</script>
